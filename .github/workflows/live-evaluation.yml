name: Live evaluation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Promptfoo suite to run"
        required: true
        default: "01_faithfulness_pass_fail.yaml"
        type: choice
        options:
          - 01_faithfulness_pass_fail.yaml
          - 02_faithfulness_suite_20.yaml
      max_tests:
        description: "Maximum number of test cases allowed"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require API key
        run: test -n "$ANTHROPIC_API_KEY"
      - name: Enforce test budget
        working-directory: promptfoo
        env:
          SUITE: ${{ inputs.suite }}
          MAX_TESTS: ${{ inputs.max_tests }}
        run: |
          count=$(grep -c 'description:' "$SUITE")
          test "$count" -le "$MAX_TESTS"
      - name: Run selected evaluation
        working-directory: promptfoo
        run: npx --yes promptfoo@latest eval -c "${{ inputs.suite }}" --no-cache
      - name: Upload Promptfoo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: |
            promptfoo/.promptfoo/
            promptfoo/*.json
          if-no-files-found: ignore

  deepeval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require API key
        run: test -n "$ANTHROPIC_API_KEY"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-deepeval.txt
      - name: Run and save DeepEval result
        run: python deepeval/faithfulness_demo.py --json > deepeval-result.json
      - name: Upload DeepEval result
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-result
          path: deepeval-result.json

  ragas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require API key
        run: test -n "$ANTHROPIC_API_KEY"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ragas.txt
      - name: Run and save RAGAS result
        run: python ragas/ragas_faithfulness.py --json > ragas-result.json
      - name: Upload RAGAS result
        uses: actions/upload-artifact@v4
        with:
          name: ragas-result
          path: ragas-result.json
